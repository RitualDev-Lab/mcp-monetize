[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-monetize"
version = "0.1.0"
description = "Drop-in billing, paywall & PASETO capability token middleware for Python FastMCP servers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "RitualDev Lab", email = "security@ritualdev.in" }
]
dependencies = [
    "cryptography>=41.0.0"
]
keywords = ["mcp", "model-context-protocol", "monetization", "billing", "fastmcp", "stripe", "dodo-payments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://ritualdev.in"
Repository = "https://github.com/RitualDev-Lab/mcp-monetize"
Issues = "https://github.com/RitualDev-Lab/mcp-monetize/issues"
